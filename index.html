:root{
  --bg:#09090b; --surface:#151517; --raised:#1e1e21; --hover:#29292d; --line:#27242c; --line-2:#3a3a40;
  --text:#f4f4f5; --text-2:#a3a3ab; --text-3:#8f8f98; --nav-dim:#c6b7d0;
  --purple:#8538f2; --purple-2:#a46bff; --green:#8edf5f; --yellow:#fff824; --red:#ff3648;
  --font-display:"Clash Display","TT Hoves Pro",Arial,sans-serif;
  --font-sans:"TT Hoves Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:var(--font-sans);
  --g:#8538f2; --g-rgb:133,56,242;
  --pxh:220px; --left:212px; --rowh:94px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--purple-2);outline-offset:2px;border-radius:8px}
img{display:block}

/* ---------- site chrome ---------- */
.hdr{height:78px;display:flex;align-items:center;gap:28px;padding:0 32px;border-bottom:1px solid var(--line)}
.hdr .logo{height:36px;width:auto}
.nav{display:flex;align-items:center;gap:4px;font-family:var(--font-display);font-size:13px}
.nav a{color:var(--nav-dim);text-decoration:none;padding:8px 12px;border-radius:7px;height:44px;display:flex;align-items:center}
.nav a.on{color:var(--text);background:var(--hover)}
.nav a:hover{color:var(--text)}
.hdr .sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;background:var(--raised);font-family:var(--font-display);font-size:13px;color:var(--text)}
.chip img{width:18px;height:18px}
.lvl{display:flex;gap:2px;margin-left:4px}
.lvl i{width:4px;height:12px;border-radius:1px;background:var(--text);opacity:.95}
.lvl i:nth-child(n+8){opacity:.25}
.ava{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#c39cf2,#680ac4 70%);border:2px solid var(--line-2)}

main{padding:22px 32px 56px;max-width:1480px;margin:0 auto}

/* ---------- title + game picker ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:18px 28px;flex-wrap:wrap;margin:6px 0 14px}
.top h1{font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
.top .sub{color:var(--text-2);font-size:13px;margin-top:6px;display:flex;gap:10px;align-items:center}
.top .sub b{color:var(--text);font-weight:500}
.tz{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:13px}
.top{display:none}




/* ---------- on now / up next ---------- */


.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 2px 12px}
.sec-h h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sec-h h2 .ld{width:9px;height:9px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 0 rgba(133,56,242,.6);animation:pulsep 1.6s infinite}
@keyframes pulsep{0%{box-shadow:0 0 0 0 rgba(133,56,242,.55)}70%{box-shadow:0 0 0 8px rgba(133,56,242,0)}100%{box-shadow:0 0 0 0 rgba(133,56,242,0)}}
.sec-h span{font-size:13px;color:var(--text-3)}
.sec-h span b{color:var(--text-2);font-weight:500}
.live-grid{--gap:14px;--cols:3;display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - var(--gap)*(var(--cols) - 1))/var(--cols));gap:var(--gap);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.live-grid::-webkit-scrollbar{display:none}
.live-grid .lc{scroll-snap-align:start}
.live-grid[data-n="2"]{--cols:2}
.live-grid[data-n="1"]{--cols:1}
.live-nav{display:none;align-items:center;gap:8px;margin-left:auto}
.live-nav[data-on]{display:inline-flex}
.live-nav .rail{width:72px;height:3px;border-radius:2px;background:var(--raised);position:relative;overflow:hidden}
.live-nav .rail i{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:2px;background:var(--text-2);transition:transform .15s,width .15s}
.live-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--text);display:grid;place-items:center;transition:background .12s,opacity .12s}
.live-nav button svg{width:15px;height:15px}
.live-nav button:hover:not(:disabled){background:var(--hover)}
.live-nav button:disabled{opacity:.3;cursor:default}
.live-grid[data-n="1"] .vid{aspect-ratio:21/9}
.live-grid[data-n="1"] .lc-body,.live-grid[data-n="2"] .lc-body{padding:16px 22px 18px}
.proto{display:inline-flex;align-items:center;gap:6px}
.proto button{height:22px;min-width:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);font-family:var(--font-display);font-size:12px;font-weight:600}
.proto button[aria-pressed="true"]{background:var(--hover);color:var(--text);border-color:var(--line-2)}
.lc{container:lc/inline-size;position:relative;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);min-width:0;user-select:none;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.lc.hl,.pk.hl{border-color:rgba(var(--g-rgb),.75);box-shadow:0 0 0 3px rgba(var(--g-rgb),.18)}
.vid{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;isolation:isolate;cursor:pointer}
.media,.media iframe{position:absolute;inset:0;width:100%;height:100%}
.media iframe{border:0;display:block;top:50%;height:auto;aspect-ratio:16/9;min-height:calc(100% + 120px);transform:translateY(-50%)}
.shield{position:absolute;inset:0;z-index:1}
.poster{position:absolute;inset:0;background:radial-gradient(110% 90% at 88% 8%,rgba(var(--g-rgb),.42),transparent 55%),linear-gradient(180deg,#141416,#09090b);display:grid;place-items:center}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,11,.1),rgba(9,9,11,.5))}
.watch{position:relative;z-index:2;height:54px;padding:0 26px 0 22px;border-radius:999px;background:var(--text);color:#09090b;display:inline-flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 12px 32px -8px rgba(0,0,0,.7);transition:transform .12s,background .15s}
.watch:hover{background:#fff;transform:translateY(-1px)}
.watch svg{width:15px;height:15px}
.ov{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;pointer-events:none}
.ov button,.ov a{pointer-events:auto}
.ov.tl{top:0;left:0}
.ov.tr{top:10px;right:10px}
.ov.br{bottom:12px;right:12px;opacity:0;transition:opacity .2s}
.vid:hover .ov.br,.vid:focus-within .ov.br{opacity:1}
.pill{height:30px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.01em;background:rgba(21,21,23,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);white-space:nowrap}
.pill.live{background:var(--purple);color:#fff;height:36px;padding:0 16px 0 14px;border-radius:0 0 16px 0;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.pill.live i{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85}
.pill.views b{font-variant-numeric:tabular-nums;font-weight:700}
.pill svg{width:15px;height:15px;flex:0 0 auto;color:var(--text-2)}
.ibtn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:rgba(9,9,11,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);color:var(--text);text-decoration:none;flex:0 0 auto}
.ibtn:hover{background:rgba(41,41,45,.92)}
.ibtn svg{width:15px;height:15px}
.st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.st.live{background:rgba(142,223,95,.14);color:var(--green)}
.st.live i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(142,223,95,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(142,223,95,.55)}70%{box-shadow:0 0 0 7px rgba(142,223,95,0)}100%{box-shadow:0 0 0 0 rgba(142,223,95,0)}}

/* under the video: teams · score, then league line (Crash live card) */
.lc-body{display:flex;flex-direction:column;gap:10px;padding:14px 16px 15px}
.lc-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:10px;min-width:0}
.tm.r{flex-direction:row-reverse;text-align:right}
.tm .n{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .lg{width:38px;height:38px}
.sc{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;line-height:1;padding:0 4px}
.sc em{font-style:normal;color:var(--text-3);font-size:12px;font-weight:600;position:relative;top:1px}
.lrow{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--text-3);font-family:var(--font-display);font-weight:500;font-size:14px;letter-spacing:-.01em;min-width:0}
.lrow span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .gi{width:24px;height:24px;border-radius:7px;background:var(--g);color:#09090b;display:grid;place-items:center;flex:0 0 auto}
.lrow .gi svg{width:15px;height:15px}
@container lc (max-width:360px){.tm .n{font-size:16px} .tm .lg{width:34px;height:34px} .sc{font-size:24px} .lrow{font-size:13px}}

/* team marks: each team gets its own monogram style */
.lg{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto}
.lg svg{width:100%;height:100%;overflow:visible;display:block}
.lg text{font-family:var(--font-display);font-weight:700;letter-spacing:-.04em;dominant-baseline:central;text-anchor:middle}

.btns{display:flex;gap:8px}
.btn{height:36px;padding:0 14px;text-decoration:none;border-radius:9px;font-family:var(--font-display);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .15s,transform .1s}
.btn.pri{background:var(--purple);color:#fff;box-shadow:0 4px 0 #5a1fb0,0 6px 24px -6px rgba(133,56,242,.6)}
.btn.pri:hover{background:var(--purple-2)}
.btn.pri:active{transform:translateY(2px);box-shadow:0 2px 0 #5a1fb0}
.btn.gho{background:var(--raised);color:var(--text)}
.btn.gho:hover{background:var(--hover)}

/* pre-match header: game tabs + market switch */
.pm-games{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px 12px}
.pm-games::-webkit-scrollbar{display:none}
.pg{flex:0 0 auto;min-width:78px;height:78px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.pg svg{width:22px;height:22px}
.pg:hover{background:var(--raised);color:var(--text)}
.pg[aria-selected="true"]{background:#2b0d60;border-color:var(--purple-2);color:#fff;box-shadow:inset 0 0 0 1px rgba(164,107,255,.5)}
.pg.off{opacity:.38}
.pg b{position:absolute}
.pm-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.mk{display:flex;gap:8px}
.mk button{height:38px;padding:0 16px;border-radius:9px;background:var(--raised);color:var(--text-2);font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:-.01em;transition:background .15s,color .15s}
.mk button:hover{background:var(--hover);color:var(--text)}
.mk button.on{background:var(--text);color:#09090b}
.help{display:flex;align-items:center;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.help a{color:var(--yellow);text-decoration:none;padding:0 12px;border-left:1px solid var(--line-2)}
.help a:first-child{border-left:0;padding-left:0}
.help a:hover{color:#fff}
.pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
/* super picks: correct series score */
.pk.sup{border-color:rgba(164,107,255,.42)}
.ss-h{display:flex;flex-direction:column;gap:3px;padding:2px 2px 4px}
.ss-pill{align-self:flex-start;background:var(--purple);color:#fff;font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border-radius:999px;margin-bottom:8px}
.ss-t{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.05}
.ss-sub{font-size:13px;color:var(--text-3)} .ss-sub b{color:var(--purple-2);font-family:var(--font-display);font-weight:700}
.ss-grid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center}
.ss-team{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--text-2);min-width:0;padding-bottom:4px}
.ss-team .lg{width:26px;height:26px;flex:0 0 auto} .ss-team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-sl{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em;padding-right:8px;font-variant-numeric:tabular-nums}
.sl{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--raised);display:flex;align-items:center;justify-content:center;line-height:1;font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s;min-width:0}
.sl em{font-style:normal;font-size:11px;color:var(--text-3);margin-left:2px}
.ss-sec{border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.fb-list{display:grid;gap:6px}
.fb-list .gap{height:4px;border-top:1px solid var(--line);margin:4px 0 0}
.fb{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;height:46px;padding:0 4px 0 6px;border-radius:10px;border:1px solid transparent;text-align:left;transition:background .12s,border-color .12s}
.fb .lg{width:24px;height:24px} .fb .pn{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .ox{height:36px;min-width:84px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s}
.fb .ox em{font-style:normal;font-size:11px;color:var(--text-3);margin-left:2px}
.fb:hover:not(:disabled) .ox{background:var(--hover)}
.fb.on .ox{background:rgba(133,56,242,.18);border-color:rgba(164,107,255,.65)}
.fb:disabled{cursor:default}
.pk-more{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;margin:-4px 2px -6px;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--text-2);text-align:left;padding:0}
.pk-more span{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-weight:500;white-space:nowrap}
.pk-more b{color:var(--purple-2);font-weight:700} .pk-more svg{width:15px;height:15px}
.pk-more:hover{color:#fff} .pk-more:hover svg{color:var(--purple-2)}
.pk-t .when{color:var(--text);font-family:var(--font-display);font-weight:600;font-size:14px}
.sl:hover:not(:disabled){background:var(--hover)}
.sl.on{background:rgba(133,56,242,.18);border-color:rgba(164,107,255,.65)}
.sl:disabled{cursor:default}
.pk{container:pk/inline-size;position:relative;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:12px;overflow:hidden;min-width:0}
.pk-bar{position:absolute;top:0;left:0;height:4px;border-radius:0 3px 3px 0;background:var(--pkc,var(--green));transition:width 1s linear,background-color 1s linear}
.pk header{display:flex;align-items:center;gap:8px;min-width:0}
.pk .gi{width:26px;height:26px;border-radius:7px;background:var(--g);color:#09090b;display:grid;place-items:center;flex:0 0 auto}
.pk .gi svg{width:15px;height:15px}
.pk-l{flex:1;min-width:0;font-family:var(--font-display);font-weight:500;font-size:14px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:0}
.pk-l:hover{color:var(--text-2)}
.pk-t{font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--text-3);white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.pk-t b{color:var(--pkc,var(--text));font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:0;font-variant-numeric:tabular-nums;transition:color 1s linear}
@container pk (max-width:330px){.pk-t .lbl{display:none}}
.pk-teams{display:flex;flex-direction:column;gap:4px}
.pk-team{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;height:52px;padding:0 10px 0 5px;border-radius:12px;background:transparent;border:1px solid transparent;text-align:left;transition:background .15s,border-color .15s}
.pk-team:hover:not(:disabled){background:var(--raised)}
.pk-team:disabled{cursor:default}
.pk-team.on{background:rgba(133,56,242,.14);border-color:rgba(164,107,255,.55)}
.pk-team .lg{width:42px;height:42px}
.pk-team .badge{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:12px;color:var(--tc);background:rgba(var(--tc-rgb),.14);border:1px solid rgba(var(--tc-rgb),.35)}
.pk-team .n{display:flex;align-items:center;gap:10px;min-width:0;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.pk-team .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{width:32px;height:32px;position:relative;flex:0 0 auto}
.gauge svg{width:32px;height:32px;transform:rotate(135deg)}
.gauge circle{fill:none;stroke-width:3;stroke-linecap:round}
.gauge .tr{stroke:var(--hover)}
.gauge .ar{stroke:currentColor}
.gauge.hi{color:var(--green)} .gauge.mid{color:var(--yellow)} .gauge.lo{color:var(--red)}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:9.5px;letter-spacing:-.02em}
.odds{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--tc)}
.odds em{font-style:normal;font-size:12px;color:var(--text-3);margin-left:2px}
.pk-cta{height:50px;border-radius:12px;background:var(--raised);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text);width:100%;transition:background .15s,transform .1s}
.pk-cta svg{width:18px;height:18px;flex:0 0 auto}
.pk-cta:hover:not(:disabled){background:var(--hover)}
.pk-cta:disabled{color:var(--text-3);cursor:default}
.pk-cta.pri{background:var(--purple);color:#fff;box-shadow:0 4px 0 #5a1fb0}
.pk-cta.pri:hover{background:var(--purple-2)}
.pk-cta.pri:active{transform:translateY(2px);box-shadow:0 2px 0 #5a1fb0}
.pk-cta.ok{background:rgba(142,223,95,.1);border:1px solid rgba(142,223,95,.35);color:var(--green)}
.pk-cta small{font-family:var(--font-sans);font-weight:500;font-size:12px;opacity:.85}
.pk.called{border-color:rgba(142,223,95,.3)}
.empty{color:var(--text-3);font-size:13px;padding:10px 8px}

/* ---------- day bar ---------- */
.hub-h{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin:0 0 14px}
.seg .day{height:40px;padding:0 18px;font-size:15px;gap:10px}
.seg .day small{font-size:13px}
.hub-sub{font-size:13px;color:var(--text-3);display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap}
.hub-sub[hidden],[hidden]{display:none!important}
.hub-sub b{color:var(--text-2);font-weight:500}
.hub-sub .tz{margin-left:2px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px}
.days{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.day{height:34px;padding:0 14px;border-radius:7px;font-family:var(--font-display);font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.day small{font-size:11px;color:var(--text-3)}
.day:hover{color:var(--text)}
.day[aria-selected="true"]{background:var(--hover);color:var(--text)}
.day[aria-selected="true"] small{color:var(--text-2)}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;border:1px solid var(--line-2);background:var(--raised)}
.legend i.live{border-color:var(--green)}
.legend i.final{background:transparent;border-style:dashed}
.legend .jump{height:28px;padding:0 10px;border-radius:999px;background:var(--raised);color:var(--text);font-family:var(--font-display);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.legend .jump i{width:6px;height:6px;border-radius:50%;background:var(--red);border:0;opacity:1}
.legend .jump:hover{background:var(--hover)}

/* ---------- EPG grid ---------- */
.epg{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--surface)}

.scroller.swap{opacity:0;transform:translateY(4px)}
.grid{position:relative;width:calc(var(--left) + var(--hours,24) * var(--pxh));min-width:100%}
.tick.dayz{color:var(--text);font-weight:600} .tick.dayz small{display:block;font-size:10px;color:var(--text-3);font-weight:500;margin-top:-2px}
.dayline{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2);z-index:3;pointer-events:none}
.thead{display:flex;height:44px;background:rgba(21,21,23,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:6;flex:0 0 var(--left);width:var(--left);background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;padding:0 16px;font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--text-3);gap:8px}
.ticks{position:relative;flex:1;height:100%}

.tick.half{border-left-color:var(--line);height:8px;top:auto;bottom:0;padding:0}
.rows{position:relative}
.rowl{position:relative;display:flex;height:var(--rowh);border-bottom:1px solid var(--line)}
.rowl:last-child{border-bottom:0}
.lab{position:sticky;left:0;z-index:4;flex:0 0 var(--left);width:var(--left);background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px 0 16px}
.lab .lm{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:#09090b;background:var(--g);box-shadow:0 0 0 1px rgba(var(--g-rgb),.35),0 6px 18px -8px rgba(var(--g-rgb),.8)}

.lab .ln span{display:block;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lane{position:relative;flex:1;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--pxh));background-position:0 0}
.lane::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--pxh)/2 - 1px),rgba(255,255,255,.035) calc(var(--pxh)/2 - 1px) calc(var(--pxh)/2),transparent calc(var(--pxh)/2) var(--pxh));pointer-events:none}

.blk{position:absolute;top:8px;bottom:8px;border-radius:8px;border:1px solid var(--line);background:var(--raised);padding:8px 12px 8px 15px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;z-index:2;color:var(--text);transition:background .15s,border-color .15s}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--g)}
.blk:hover{background:var(--hover);border-color:var(--line-2);z-index:3}
.blk.sel{border-color:var(--text)}
.blk.final{background:transparent;border-style:dashed;color:var(--text-2)}
.blk.final::before{opacity:.45}

.blk.live::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--g) var(--p),rgba(255,255,255,.07) var(--p))}
.blk>*{position:relative}
.blk .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-display);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}

.blk.xs{padding:6px 6px 6px 9px;justify-content:center}

.blk.xs .l2{gap:3px;justify-content:center}
.blk.live .l1 .st{height:18px;padding:0 7px;font-size:10px;letter-spacing:.05em}

.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:4;pointer-events:none}

  *{animation:none!important;transition:none!important}

/* ===== type + colour, copied from the live site ===== */

.pk-more::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(90deg,#8538f2,#ff8a3d 70%,#fff824);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:-1}

.pk-more b{margin-left:auto;height:auto;padding:0;background:none;color:var(--green);font-size:18px;font-weight:700;letter-spacing:-.01em}
.pk-more>svg{display:block;width:16px;height:16px;color:var(--text);flex:0 0 auto}
.pk-more:hover{background:#141417} .pk-more:hover b{color:var(--green)} .pk-more:hover>span{color:#fff}
.pk-more .ssi{display:none}
/* ===== board: two across, four facts per row ===== */
.bd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-1)}
.bd .bd-bar,.bd .empty,.bd .bd-more,.bd .bd-exp{grid-column:1/-1}
.bd-row{min-height:64px;padding:10px 10px 10px 12px;border-radius:12px;background:#0d0d0f;border:1px solid transparent;isolation:isolate;overflow:visible}
.bd-row::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(90deg,rgba(133,56,242,.9),rgba(255,138,61,.8) 70%,rgba(255,248,36,.8));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:-1;opacity:.75;transition:opacity .2s}
.bd-row:hover{background:#121215;border-color:transparent} .bd-row:hover::before{opacity:1}
.bd-row::after{border-radius:inherit}
.bd-row .gi{display:none}
.bd-row{grid-template-columns:minmax(0,1fr) auto;gap:var(--gap-2)}
.bd-m{font-size:14px} .bd-m .lg{width:24px;height:24px}
.bd-s{margin-top:4px;gap:8px;font-size:12px;color:var(--text-3)}
.bd-s button{color:var(--text-3);font-size:12px} .bd-s button:hover{color:var(--text);text-decoration:none}
.bd-s span:not(.soon)::before{content:"·";margin-right:8px;color:var(--dash)}
.bd-s .soon{color:var(--soon)} .bd-s .soon::before{content:"·";margin-right:8px;color:var(--dash)}
.bd .odds{color:var(--green);font-size:16px;min-width:88px} .bd .odds em{color:rgba(142,223,95,.7)}
.bd .odds.on{color:#fff} .bd .odds.done{color:var(--text)}
@media (max-width:900px){.bd{grid-template-columns:1fr}}

/* ===== board: one row per match ===== */
.bd-row{cursor:pointer}
.bd-row .bd-m em{font-style:normal;color:var(--dash);font-size:11px;font-weight:600;margin:0 2px}
.bd-row .bd-s span:first-child::before{content:none;margin:0} .bd-row .bd-s .soon:first-child::before{content:none;margin:0}
.bd-row.open{background:#121215} .bd-row.open::before{opacity:1}
.bd-exp{grid-column:1/-1;margin:-2px 0 4px}
.bd-exp .pk{cursor:default}
.bd .odds.on{color:#fff}

/* ===== super picks as a third row in the card grid ===== */
.pk-more{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--gap-1);align-items:center;height:44px;margin:0;padding:0 4px;border-radius:var(--ctl-r);background:transparent;isolation:auto;position:relative;text-align:left}
.pk-more::before{content:"";position:absolute;left:4px;right:4px;top:-5px;height:1px;background:var(--line);padding:0;-webkit-mask:none;mask:none;z-index:0;opacity:1}
.pk-more .ssi{display:grid;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6d2fd6,#a46bff);color:#fff;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.pk-more .ssi svg{width:15px;height:15px}
.pk-more .n{display:flex;flex-direction:column;min-width:0;gap:2px}
.pk-more .n span{font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text);line-height:1.1}
.pk-more .n small{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.pk-more .odds.sup{color:var(--purple-2)} .pk-more .odds.sup em{color:rgba(164,107,255,.7)}
.pk-more:hover{background:transparent} .pk-more:hover .odds.sup{background:#26262c;border-color:rgba(255,255,255,.16)}
.pk-more:active .odds.sup{transform:translateY(3px);box-shadow:0 0 0 #0c0c0e}
.pk-more>svg{display:none} .pk-more b{display:none}
.pk-teams{margin-bottom:4px}

/* ===== super picks row: left-aligned, bare glyph, soft purple wash at the card's foot ===== */
.pk-more{margin:4px -12px -12px;padding:0 12px 0 16px;height:52px;border-radius:0 0 15px 15px;text-align:left;justify-items:start;
  background:linear-gradient(180deg,rgba(133,56,242,0) 0%,rgba(133,56,242,.16) 100%)}
.pk-more::before{display:none}
.pk-more .ssi{background:none;box-shadow:none;color:var(--purple-2);width:24px;height:24px;border-radius:0}
.pk-more .ssi svg{width:20px;height:20px}
.pk-more .n{align-items:flex-start;text-align:left;justify-self:start;width:100%}
.pk-more .n span,.pk-more .n small{text-align:left}
.pk-more .odds.sup{justify-self:end}
.pk-more:hover{background:linear-gradient(180deg,rgba(133,56,242,0) 0%,rgba(133,56,242,.26) 100%)}
.pk-teams{margin-bottom:0}


/* ===== game tiles: the chosen game lights up in its own colour ===== */
.pg{position:relative;isolation:isolate;transition:background .18s,color .18s,transform .12s,border-color .18s}
.pg:active{transform:scale(.96)}
.pg svg{transition:transform .18s,filter .18s}
.pg[aria-selected="true"]{color:#fff;border-color:transparent;box-shadow:none;
  background:linear-gradient(180deg,rgba(var(--pg-rgb),.42) 0%,rgba(var(--pg-rgb),.14) 100%),#151517;
  animation:pgpop .28s cubic-bezier(.16,.84,.32,1)}
.pg[aria-selected="true"]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;z-index:-1;pointer-events:none;
  background:linear-gradient(135deg,var(--pg) 0%,#fff 48%,var(--pg) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.pg[aria-selected="true"] svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 7px rgba(var(--pg-rgb),.85))}
.pg[aria-selected="true"] span{color:#fff}
.pg:not([aria-selected="true"]):hover{color:var(--text);border-color:var(--line-2);background:var(--raised)}
.pg:not([aria-selected="true"]):hover svg{color:var(--pg)}
@keyframes pgpop{0%{transform:scale(.96)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pg,.pg svg{transition:none} .pg[aria-selected="true"]{animation:none}}

/* ===== view switch: selected segment lights up like a chosen game tile ===== */
#viewTabs .day{position:relative;isolation:isolate;--pg:#a46bff;--pg-rgb:164,107,255;transition:background .18s,color .18s,transform .12s}
#viewTabs .day:active{transform:scale(.96)}
#viewTabs .day[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,rgba(var(--pg-rgb),.42) 0%,rgba(var(--pg-rgb),.14) 100%),#151517;animation:pgpop .28s cubic-bezier(.16,.84,.32,1)}
#viewTabs .day[aria-selected="true"]::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;pointer-events:none;
  background:linear-gradient(135deg,var(--pg) 0%,#fff 48%,var(--pg) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#viewTabs .day:not([aria-selected="true"]):hover{color:var(--text)}
@media (prefers-reduced-motion:reduce){#viewTabs .day{transition:none} #viewTabs .day[aria-selected="true"]{animation:none}}

/* ===== the super pick multiplier is the biggest number on the card ===== */
.pk-more .odds.sup{min-width:100px;height:38px;padding:0 14px;font-size:18px;font-weight:700;letter-spacing:-.01em;color:#fff;
  background:linear-gradient(180deg,rgba(133,56,242,.5),rgba(133,56,242,.28)),#1e1e23;border-color:rgba(164,107,255,.75);border-bottom-color:rgba(164,107,255,.35);
  box-shadow:0 3px 0 #3a1778,0 0 18px rgba(133,56,242,.28)}
.pk-more .odds.sup em{color:rgba(255,255,255,.75);font-size:12px;font-weight:700}
.pk-more:hover .odds.sup{background:linear-gradient(180deg,rgba(133,56,242,.62),rgba(133,56,242,.36)),#1e1e23;border-color:var(--purple-2);box-shadow:0 3px 0 #3a1778,0 0 24px rgba(133,56,242,.4)}
.pk-more:active .odds.sup{transform:translateY(3px);box-shadow:0 0 0 #3a1778,0 0 12px rgba(133,56,242,.3)}
</style>

function rng(seed){ let h=2166136261; for (const c of seed){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return () => { h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];

function etNow(){ const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'numeric',hour12:false,weekday:'short',month:'short',day:'numeric'}).formatToParts(new Date()); const g=t=>p.find(x=>x.type===t).value; return { min:(parseInt(g('hour'),10)%24)*60+parseInt(g('minute'),10), wd:g('weekday'), mo:g('month'), d:parseInt(g('day'),10) }; }
function dayLabel(i){ const d=new Date(); d.setDate(d.getDate()+i); const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric'}).formatToParts(d); const g=t=>p.find(x=>x.type===t).value; return { wd:g('weekday'), md:`${g('month')} ${g('day')}` }; }
function fmtT(m){ m=((m%MIN)+MIN)%MIN; let h=Math.floor(m/60), mm=m%60; const ap=h>=12?'PM':'AM'; h=h%12||12; return `${h}:${String(mm).padStart(2,'0')} ${ap}`; }
function fmtH(h){ const ap=h>=12&&h<24?'PM':'AM'; const x=h%12||12; return `${x} ${ap}`; }
function fmtDur(m){ const h=Math.floor(m/60), mm=m%60; return h? (mm?`${h}h ${mm}m`:`${h}h`) : `${mm}m`; }

/* ---------- schedule generation ---------- */
function build(game, day, nowMin, want){
  const rows = game.rows.map((row, rIdx) => {
    const r = rng(`${game.id}|${day}|${rIdx}`);
    const blocks = [];
    if (r() < 0.12) return { ...row, blocks };     // dark day for this league
    let t = row.w[0]*60 + ri(r,0,3)*15;
    const end = row.w[1]*60;
    let used = [];
    while (t < end - 25){
      const dur = Math.round(ri(r,game.dur[0],game.dur[1])/5)*5;
      let a = pick(r, game.teams), b = pick(r, game.teams);
      let guard = 0; while ((b===a || used.includes(b[0]) || used.includes(a[0])) && guard++<12){ a=pick(r,game.teams); b=pick(r,game.teams); }
      used.push(a[0],b[0]); if (used.length>6) used=used.slice(-4);
      blocks.push({ s:t, e:t+dur, a, b, fmt:pick(r,game.fmt), stage:pick(r,game.stages), seed:r() });
      t += dur + Math.round(ri(r,game.gap[0],game.gap[1])/5)*5;
    }
    return { ...row, blocks };
  });
  // today: exactly `want` streams live for this game (0–3), each in its own league
  if (day===0 && !want){
    rows.forEach(rw => { rw.blocks = rw.blocks.filter(b => !(b.s<=nowMin && nowMin<b.e)); });
  } else if (day===0){
    const r = rng(`${game.id}|live`);
    const liveRows = rows.filter(rw => rw.blocks.some(b => b.s<=nowMin && nowMin<b.e));
    while (liveRows.length>want){ const rw=liveRows.pop(); rw.blocks = rw.blocks.filter(b => !(b.s<=nowMin && nowMin<b.e)); }
    const cands = rows.filter(rw => !liveRows.includes(rw)).sort((x,y) => (x.w[0]*60<=nowMin&&nowMin<x.w[1]*60?0:1)-(y.w[0]*60<=nowMin&&nowMin<y.w[1]*60?0:1));
    const used = new Set(liveRows.flatMap(rw => rw.blocks.filter(b => b.s<=nowMin && nowMin<b.e).flatMap(b => [b.a[0], b.b[0]])));
    const free = game.teams.filter(t => !used.has(t[0]));
    for (let i=free.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [free[i],free[j]]=[free[j],free[i]]; }
    let ti = 0;
    for (const rw of cands){
      if (liveRows.length>=want || ti+1>=free.length) break;
      const dur = Math.round(ri(r,game.dur[0],game.dur[1])/5)*5;
      const s0 = Math.max(0, nowMin - Math.round(dur*ri(r,20,70)/100/5)*5);
      const lb = { s:s0, e:Math.min(MIN, s0+dur), a:free[ti], b:free[ti+1], fmt:game.fmt[0], stage:pick(r,game.stages), seed:r() };
      ti += 2;
      rw.blocks = rw.blocks.filter(x => x.e<=s0-10 || x.s>=lb.e+10);
      rw.blocks.push(lb); rw.blocks.sort((x,y)=>x.s-y.s); liveRows.push(rw);
    }
  }
  // status + scores
  rows.forEach(rw => rw.blocks.forEach(b => {
    b.status = day>0 ? 'up' : (b.e<=nowMin ? 'final' : (b.s<=nowMin ? 'live' : 'up'));
    const r = rng(`${game.id}|${day}|${b.s}|${b.a[1]}`);
    const max = game.scoreMax;
    if (b.status==='final'){ const w=ri(r,0,1); const l=ri(r,0,max-1); b.score = w? [max,l] : [l,max]; }
    else if (b.status==='live'){ const prog=(nowMin-b.s)/(b.e-b.s); const tot=Math.max(0,Math.round(prog*(max*2-1))); const x=ri(r,0,tot); b.score=[x,tot-x]; b.prog=prog; }
  }));
  return rows;
}

const expand = (rows, d=0) => rows.flatMap(rw => rw.blocks.map(b => ({...b, g:rw.g, row:b.lg||rw, ri:b.ri??rw.ri, d})));

const dayWord = d => d===0 ? 'Today' : d===1 ? 'Tomorrow' : dayLabel(d).wd;
// every league of every game for one day; empty leagues drop out, live then soonest-to-start float up
function dayRows(day, wants){
  return GAMES.map(g => {
    const leagues = build(g, day, now.min, wants[g.id]||0);
    if (day===0){ const nxt = build(g, 1, now.min, 0); leagues.forEach((rw,i) => { rw.blocks = rw.blocks.concat(nxt[i].blocks.filter(b => b.s < 12*60).map(b => ({...b, s:b.s+MIN, e:b.e+MIN, d:1}))); }); }
    const S0 = day===0 ? Math.floor((now.min - 100)/30)*30 : 0;
    const all = leagues.flatMap((rw,ri) => rw.blocks.filter(b => b.status!=='final' || b.e > S0).map(b => ({...b, lg:rw, ri}))).sort((x,y) => x.s-y.s);
    const blocks = [];                                   // one lane: a later match that overlaps is dropped, unless it is the live one
    for (const b of all){ const last=blocks[blocks.length-1]; if (last && b.s < last.e+5){ if (b.status==='live' && last.status!=='live') blocks[blocks.length-1]=b; continue; } blocks.push(b); }
    return { g, ri:0, n:g.name, m:g.mono, blocks };
  }).map((rw,i) => { const nx = rw.blocks.find(b => b.status==='up'); return { rw, k: rw.blocks.some(b=>b.status==='live') ? 0 : nx ? 1 + nx.s/1e5 : 9, i }; })
    .filter(x => x.k<9).sort((a,b) => a.k-b.k || a.i-b.i).map(x => x.rw);   // live first, then whoever plays next; games with nothing scheduled are hidden
}
const key = b => `${b.g.id}:${b.ri}:${b.s}`;
// how many streams are live right now, and in which games (1–3, never more)
function liveWants(){
  const r = rng(`live|${now.wd}|${Math.floor(now.min/30)}`);
  const n = state.liveN || [1,2,2,3,3][ri(r,0,4)];
  const gs = GAMES.slice(); for (let i=gs.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [gs[i],gs[j]]=[gs[j],gs[i]]; }
  const w = {}; gs.slice(0,n).forEach(g => w[g.id]=1); return w;
}

function blockHTML(b, rw){
  const s0 = Math.max(b.s, START()), w = (Math.min(b.e,HOURS()*60)-s0)*PXH/60;
  const size = w<90?' xs':(w<200?' sm':'');
  const bd = b.d || 0, kk = `${rw.g.id}:${b.ri??rw.ri}:${b.s - bd*MIN}`;
  const selected = state.sel===kk ? ' sel' : '';
  const unit = rw.g.solo ? 'Set' : 'Map';
  const live = b.status==='live';
  const t = tm => `<span class="t">${logo(tm)}<span>${tm[0]}</span></span>`;
  const fin = b.status==='final';
  const teams = (live || fin)
    ? `${t(b.a)}<b class="sc">${b.score[0]}<i>–</i>${b.score[1]}</b>${t(b.b)}`
    : `${t(b.a)}<em>vs</em>${t(b.b)}`;
  const left = Math.max(0, b.e - now.min);
  const sub = live
    ? `<span class="when"><span class="dot"></span>${(b.lg||rw).m} · ${unit} ${b.score[0]+b.score[1]+1} · ${left>=60?`${Math.floor(left/60)}h ${left%60}m`:`${left}m`} left</span><span class="bar"><i style="width:${Math.round((b.prog||0)*100)}%"></i></span>`
    : fin ? `<span class="when">Final</span><span class="fmt">${(b.lg||rw).m} · ${b.fmt}</span>`
    : `<span class="when">${fmtT(b.s)}</span><span class="fmt">${(b.lg||rw).m} · ${b.fmt}</span>`;
  const thumb = false && w>=380 ? `<span class="th"><img src="https://i.ytimg.com/vi/${VID}/mqdefault.jpg" alt="" loading="lazy"></span>` : '';
  return `<button type="button" class="blk ${b.status}${size}${selected}${thumb?' has-th':''}" data-k="${kk}" data-d="${bd}" style="left:${X(s0)}px;width:${w-6}px" aria-label="${b.a[0]} versus ${b.b[0]}, ${fmtT(b.s)} to ${fmtT(b.e)}, ${(b.lg||rw).n}">
    ${thumb}<span class="in"><span class="l1">${teams}</span><span class="l2">${sub}</span></span></button>`;
}
function laneHTML(rw){
  const S=START(), END=HOURS()*60, out=[]; let cur=S;
  const bs = rw.blocks.filter(b => b.e > S && b.s < END).sort((x,y)=>x.s-y.s);
  const gap = (gs, ge, next) => { const w=(ge-gs)*PXH/60; if (w<24) return ''; const label = w>=150 ? (next ? `Next ${fmtT(next.s)}` : 'Nothing scheduled') : ''; return `<div class="gapt" style="left:${X(gs)}px;width:${w-6}px"><span>${label}</span></div>`; };
  for (const b of bs){ const s0=Math.max(b.s,S); if (s0>cur) out.push(gap(cur, s0, b)); out.push(blockHTML(b, rw)); cur=Math.max(cur, Math.min(b.e,END)); }
  if (cur<END) out.push(gap(cur, END, null));
  return out.join('');
}

const TC=[['#8edf5f','142,223,95'],['#41a9ff','65,169,255'],['#c39cf2','195,156,242'],['#fff824','255,248,36'],['#ff9a1f','255,154,31'],['#ff4d8d','255,77,141'],['#5fe0d2','95,224,210'],['#ff6b6b','255,107,107'],['#f4f4f5','244,244,245']];
const hash = str => { let h=0; for (const c of str) h=(h*31+c.charCodeAt(0))>>>0; return h; };
const tcol = t => { const c=TC[hash(t[0])%TC.length]; return `--tc:${c[0]};--tc-rgb:${c[1]}`; };
// eight mark styles, so a row of teams reads like real brands rather than a set of tags
function logo(t){
  const h=hash(t[0]), c=TC[h%TC.length][0], style=(h>>>3)%8, m=MARK[t[0]]||t[0][0].toUpperCase();
  const fs = m.length>=3?15:(m.length===2?20:27), dark='#09090b';
  const T=(fill,extra='')=>`<text x="24" y="25" font-size="${fs}" fill="${fill}" ${extra}>${m}</text>`;
  let body='';
  switch(style){
    case 0: body=`<path d="M24 3 42 9.5v12.5c0 10.5-7.6 18.6-18 22C13.6 40.6 6 32.5 6 22V9.5z" fill="${c}"/>${T(dark)}`; break;                                  // shield
    case 1: body=`<circle cx="24" cy="24" r="21" fill="${c}"/><circle cx="24" cy="24" r="17.5" fill="none" stroke="${dark}" stroke-opacity=".35" stroke-width="1.5"/>${T(dark)}`; break; // ring
    case 2: body=`<g transform="skewX(-14) translate(6 0)">${T(c,`font-size="${fs+6}"`)}<rect x="8" y="39" width="32" height="4" fill="${c}"/></g>`; break;        // slanted wordmark
    case 3: body=`<path d="M24 3 42.2 13.5v21L24 45 5.8 34.5v-21z" fill="${c}" fill-opacity=".13" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>${T(c)}`; break; // hex crest
    case 4: body=`<rect x="4" y="4" width="40" height="40" rx="11" fill="${c}"/><path d="M44 4v40H4z" fill="${dark}" fill-opacity=".28"/>${T('#fff')}`; break;        // split tile
    case 5: body=`<path d="M24 3 45 24 24 45 3 24z" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/>${T(c)}`; break;          // diamond
    case 6: body=`${T('none',`font-size="${fs+8}" stroke="${c}" stroke-width="1.8" paint-order="stroke" stroke-linejoin="round"`)}<circle cx="40" cy="40" r="4" fill="${c}"/>`; break; // outline + dot
    default: body=`<path d="M9 4h22l13 13v22a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9a5 5 0 0 1 5-5z" fill="${c}"/>${T(dark)}`; break;                                     // cut corner
  }
  return `<span class="lg" style="${tcol(t)}" aria-hidden="true"><svg viewBox="0 0 48 48">${body}</svg></span>`;
}

  return out;
}
const fmtLock = s => s<3600 ? `${Math.floor(s/60)}m` : s<86400 ? `${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m` : `${Math.floor(s/86400)}d`;
function boardHTML(matches){
  const B=state.bd;
  // one row per match: Super picks is a single call per match, picked from that match's menu
  let rows = matches.map(b => { const st=stakesFor(b); const best=st.reduce((m,x)=>x.mult>m.mult?x:m, st[0]); return { b, st, best, calls: st.reduce((n,x)=>n+x.calls,0), rem:(b.s+b.d*MIN)*60-etSec(), edge: st.some(x=>x.edge) }; });
  const sorters = { hi:(x,y)=>y.best.mult-x.best.mult, soon:(x,y)=>x.rem-y.rem, pop:(x,y)=>y.calls-x.calls };
  const pinned = r => B.open[key(r.b)+':'+r.b.d] ? 0 : 1;
  rows.sort((x,y) => pinned(x)-pinned(y) || sorters[B.sort](x,y));
  const total = rows.length; rows = rows.slice(0, B.limit);
  const bar = `<div class="bd-bar"><div class="mk" role="tablist" aria-label="Sort">${[['hi','Biggest hit'],['soon','Closing soon'],['pop','Popular']].map(([k,l]) => `<button type="button" class="${B.sort===k?'on':''}" data-sort="${k}">${l}</button>`).join('')}</div></div>`;
  const row = r => { const b=r.b, g=b.g, k=key(b), id=k+':'+b.d, pk='s:'+b.d+':'+k, called=calls[pk], open=!!B.open[id];
    const btn = called ? `<button type="button" class="odds done" disabled><b>${called.amt}</b><em>+${called.est}</em></button>`
      : `<button type="button" class="odds${open?' on':''}" data-act="open">${r.best.mult.toFixed(2)}<em>×</em></button>`;
    return `<div class="bd-row${open?' open':''}" data-k="${k}" data-d="${b.d}" role="button" tabindex="0" style="--g:${g.hue};--g-rgb:${g.rgb};--ta:${TC[hash(b.a[0])%TC.length][1]};--tb:${TC[hash(b.b[0])%TC.length][1]}">
      <span class="gi">${g.icon}</span>
      <div style="min-width:0"><div class="bd-m">${logo(b.a)}${b.a[0]}<em>vs</em>${logo(b.b)}${b.b[0]}${r.edge?'<span class="tag">Edge</span>':''}</div>
      <div class="bd-s"><span class="${r.rem<3600?'soon':''}">${fmtLock(r.rem)}</span><span>${called ? called.name : `Best ${r.best.name}`}</span></div></div>
      ${btn}</div>${open ? `<div class="bd-exp">${cardHTML(b)}</div>` : ''}`; };
  return bar + (rows.length ? rows.map(row).join('') : `<div class="empty">Nothing open.</div>`) + (total>rows.length ? `<button type="button" class="bd-more" data-act="more">Show ${Math.min(24,total-rows.length)} more of ${total}</button>` : '');
}
function renderNext(){
  const sup = state.market==='super', stake = sup ? 25 : 10;
  const pool = pmPool(); state.pool = pool;
  const counts = {}; GAMES.forEach(g => counts[g.id] = pool.filter(b=>b.g===g).length);
  const sel = state.pmGame;
  const all = sel==='all' ? pool : pool.filter(b=>b.g.id===sel), up = all.slice(0,8);
  const gname = sel==='all' ? 'across all games' : GAMES.find(g=>g.id===sel).name;
  $('pmGames').innerHTML = [`<button type="button" class="pg" role="tab" data-g="all" aria-selected="${sel==='all'}" style="--pg:#a46bff;--pg-rgb:164,107,255" title="All games">${ALLICON}<span>All</span></button>`]
    .concat(GAMES.map(g => `<button type="button" class="pg${counts[g.id]?'':' off'}" role="tab" data-g="${g.id}" aria-selected="${sel===g.id}" style="--pg:${g.hue};--pg-rgb:${g.rgb}" title="${g.name}">${g.icon}<span>${SHORT[g.id]}</span></button>`)).join('');
  $('pmGames').querySelectorAll('.pg').forEach(bt => bt.addEventListener('click', () => { state.pmGame=bt.dataset.g; renderNext(); }));
  $('pmCount').textContent = `${pool.length} open`;
  $('nextSub').innerHTML = up.length ? `<b>${up.length<all.length?'Next ':''}${up.length} ${gname}</b> · ${stake} tickets per call · lock at start` : `<b>No ${sup?'super picks':'win'} markets ${gname}</b> in the next 3 days`;
  $('nextList').className = sup ? 'bd' : 'pm-grid';
  $('nextList').innerHTML = !all.length ? `<div class="empty">Nothing open.</div>` : sup ? boardHTML(all) : up.map(cardHTML).join('');
  if (sup){
    const L=$('nextList'), B=state.bd;
    L.querySelectorAll('[data-sort]').forEach(x => x.addEventListener('click', () => { B.sort=x.dataset.sort; renderNext(); }));
    L.querySelectorAll('[data-type]').forEach(x => x.addEventListener('click', () => { B.types[x.dataset.type]=!B.types[x.dataset.type]; renderNext(); }));
    L.querySelectorAll('[data-band]').forEach(x => x.addEventListener('click', () => { B.bands[x.dataset.band]=!B.bands[x.dataset.band]; renderNext(); }));
    const more=L.querySelector('[data-act="more"]'); if (more) more.addEventListener('click', () => { B.limit+=24; renderNext(); });
    L.querySelectorAll('.bd-row').forEach(rw => {
      const id = rw.dataset.k+':'+rw.dataset.d;
      rw.addEventListener('click', e => { if (e.target.closest('.odds.done')) return; B.open[id]=!B.open[id]; renderNext(); if (B.open[id]){ const el=L.querySelector(`.bd-row[data-k="${rw.dataset.k}"][data-d="${rw.dataset.d}"]`); if (el) el.scrollIntoView({behavior:'smooth',block:'start'}); } });
      rw.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); rw.click(); } });
    });
  }
  $('nextList').querySelectorAll('.pk').forEach(card => {
    const d = +card.dataset.d, k = (sup?'s:':'') + d + ':' + card.dataset.k;
    card.querySelectorAll('.pk-team,.sl,.fb').forEach(t => t.addEventListener('click', () => { if (calls[k]) return; picks[k]=t.dataset.p; renderNext(); }));
    card.querySelectorAll('[data-act="feat"]').forEach(x => x.addEventListener('click', () => { state.sel=card.dataset.k; const s=+card.dataset.k.split(':').pop(); const td = (d===1 && s<12*60) ? 0 : d; if (state.day!==td){ state.day=td; renderDays(); setView(state.view); refresh(false); } else renderRows(); setView('sched'); scrollTo(card.dataset.k, d); $('scroller').scrollIntoView({behavior:'smooth',block:'nearest'}); }));
    const sb = card.querySelector('[data-act="super"]'); if (sb) sb.addEventListener('click', () => { state.bd.open[card.dataset.k+':'+d]=true; setMarket('super'); const el=$('nextList').querySelector(`.bd-row[data-k="${card.dataset.k}"][data-d="${d}"]`); if (el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('hl'); setTimeout(()=>el.classList.remove('hl'),1600); } });
  });
}
setInterval(() => { $('nextList').querySelectorAll('.pk').forEach(card => { const b=state.pool.find(x=>key(x)===card.dataset.k && x.d===+card.dataset.d); if (!b) return; const rem=(b.s+b.d*MIN)*60-etSec(); const el=card.querySelector('[data-cd]'); if (el) el.textContent=fmtClock(rem);
  const lk=lockBar(rem); let bar=card.querySelector('.pk-bar'); if (lk.on){ if (!bar){ bar=document.createElement('i'); bar.className='pk-bar'; card.prepend(bar); } bar.style.width=lk.w+'%'; card.style.setProperty('--pkc', lk.c); } else if (bar) bar.remove(); }); }, 1000);
function scrollTo(k, d=state.day){
  const el = $('rows').querySelector(`[data-k="${k}"][data-d="${d}"]`) || $('rows').querySelector(`[data-k="${k}"]`); if (!el) return;
  const sc=$('scroller'); sc.scrollTo({ left: Math.max(0, el.offsetLeft - sc.clientWidth*0.25), behavior:'smooth' });
}
function jumpNow(){ const sc=$('scroller'); sc.scrollTo({ left: 0, behavior:'smooth' }); }

function refresh(animate){
  const sc=$('scroller');
  const paint = () => {
    readVars(); renderTicks();
    const wants = liveWants();
    state.today = dayRows(0, wants);
    state.ahead = [dayRows(1, {}), dayRows(2, {})];
    state.rows = state.day===0 ? state.today : state.ahead[state.day-1];
    $('rowCount').textContent = state.rows.length;
    $('matchCount').textContent = state.rows.reduce((n,r)=>n+r.blocks.length,0);
    $('schedCount').textContent = `${state.today.reduce((n,r)=>n+r.blocks.filter(b=>b.status!=='final').length,0)} today`;
    $('dayWord').textContent = state.day===0 ? 'today' : dayLabel(state.day).wd;
    $('jump').hidden = state.day!==0;
    renderRows(); renderLive(); renderNext();
    if (state.day===0) jumpNow(); else { const first=flat().sort((x,y)=>x.s-y.s)[0]; if (first) sc.scrollTo({left:Math.max(0,X(first.s)-40),behavior:'auto'}); }
    sc.classList.remove('swap');
  };
  if (animate){ sc.classList.add('swap'); setTimeout(paint, 180); } else paint();
}

$('jump').addEventListener('click', jumpNow);
function setView(v){
  state.view = v;
  $('viewTabs').querySelectorAll('.day').forEach(b => b.setAttribute('aria-selected', b.dataset.v===v));
  $('panePm').hidden = v!=='pm'; $('paneSched').hidden = v!=='sched'; $('mkTabs').hidden = v!=='pm';
  $('nextSub').hidden = v!=='pm'; $('schedSub').hidden = v!=='sched';
  if (v==='sched') requestAnimationFrame(() => { if (state.day===0) jumpNow(); });
}
$('viewTabs').querySelectorAll('.day').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
function setMarket(m){ state.market=m; $('mkTabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.m===m)); renderNext(); }
$('mkTabs').querySelectorAll('button').forEach(bt => bt.addEventListener('click', () => { setMarket(bt.dataset.m); }));
$('scroller').addEventListener('scroll', () => { $('headwrap').scrollLeft = $('scroller').scrollLeft; }, {passive:true});
document.querySelectorAll('.proto button').forEach(bt => bt.addEventListener('click', () => { state.liveN=+bt.dataset.n; document.querySelectorAll('.proto button').forEach(x => x.setAttribute('aria-pressed', x===bt)); refresh(false); }));

renderDays(); setView(state.view); refresh(false);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt=setTimeout(() => { const o=PXH; readVars(); if (o!==PXH){ renderTicks(); renderRows(); } }, 150); });
})();
</script>
